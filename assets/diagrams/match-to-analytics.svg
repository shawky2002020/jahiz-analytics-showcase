<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Jahiz analytics processing flow</title>
  <desc id="desc">A domain change creates an analytics task in PostgreSQL, a worker claims it using row locking, computes derived analytics, and persists the result for API reads.</desc>
  <rect width="1200" height="520" rx="24" fill="#0b1220"/>
  <text x="60" y="68" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Match → Analytics</text>
  <text x="60" y="102" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#94a3b8">Heavier aggregation runs outside the interactive request path</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <g font-family="system-ui,-apple-system,sans-serif">
    <g transform="translate(55 185)"><rect width="190" height="120" rx="16" fill="#111c31" stroke="#334155"/><text x="95" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Domain change</text><text x="95" y="75" text-anchor="middle" font-size="13" fill="#94a3b8">match finalized or</text><text x="95" y="97" text-anchor="middle" font-size="13" fill="#94a3b8">analytics invalidated</text></g>
    <g transform="translate(300 185)"><rect width="190" height="120" rx="16" fill="#111c31" stroke="#38bdf8"/><text x="95" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Task row</text><text x="95" y="75" text-anchor="middle" font-size="13" fill="#94a3b8">PostgreSQL lifecycle</text><text x="95" y="97" text-anchor="middle" font-size="13" fill="#94a3b8">pending · retry · done</text></g>
    <g transform="translate(545 185)"><rect width="190" height="120" rx="16" fill="#111c31" stroke="#f59e0b"/><text x="95" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Worker claim</text><text x="95" y="75" text-anchor="middle" font-size="13" fill="#94a3b8">FOR UPDATE</text><text x="95" y="97" text-anchor="middle" font-size="13" fill="#94a3b8">SKIP LOCKED</text></g>
    <g transform="translate(790 185)"><rect width="190" height="120" rx="16" fill="#111c31" stroke="#a78bfa"/><text x="95" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Aggregation</text><text x="95" y="75" text-anchor="middle" font-size="13" fill="#94a3b8">derive match / athlete</text><text x="95" y="97" text-anchor="middle" font-size="13" fill="#94a3b8">analytics</text></g>
    <g transform="translate(1030 185)"><rect width="120" height="120" rx="16" fill="#111c31" stroke="#34d399"/><text x="60" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Persist</text><text x="60" y="75" text-anchor="middle" font-size="13" fill="#94a3b8">derived</text><text x="60" y="97" text-anchor="middle" font-size="13" fill="#94a3b8">state</text></g>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M245 245 H290"/><path d="M490 245 H535"/><path d="M735 245 H780"/><path d="M980 245 H1020"/></g>
  <text x="350" y="390" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#94a3b8">Tradeoff: task coordination shares PostgreSQL capacity and requires explicit retry/stale-task handling.</text>
</svg>
