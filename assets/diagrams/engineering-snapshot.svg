<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" role="img" aria-labelledby="es-title es-desc">
  <title id="es-title">Jahiz Analytics Production Engineering Snapshot</title>
  <desc id="es-desc">High-level executive summary of the production architecture, state engine, backend APIs, relational model, async worker, and release engineering.</desc>
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="1200" height="640" rx="16" fill="url(#bg7)" stroke="#1e293b" stroke-width="2" />

  <!-- Top Hero Header -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="85" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">PRODUCTION PRODUCT</text>

    <text y="64" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#f8fafc">JAHIZ ANALYTICS</text>
    <text y="92" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">Production Cross-Platform Sports Intelligence Platform Shipped to iOS &amp; Android</text>
  </g>

  <!-- Store Badges at Top Right -->
  <g transform="translate(870, 45)">
    <rect width="130" height="42" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="65" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">Google Play</text>

    <rect x="145" y="0" width="130" height="42" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="210" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">App Store</text>
  </g>

  <!-- 6 Pillars Cards Grid (2 rows of 3) -->
  <!-- Card 1: Client & Mobile -->
  <g transform="translate(50, 165)">
    <rect width="345" height="205" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="16" width="4" height="22" rx="2" fill="#38bdf8" />
    <text x="28" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Client &amp; Mobile Platform</text>
    <text x="16" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Angular 20, Ionic 8 &amp; Capacitor 7</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Standalone OnPush architecture &amp; Signals</text>
    <text x="16" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Native plugins (Haptics, Orientation, Camera)</text>
    <text x="16" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• True bilingual RTL/LTR layout parity</text>
    <text x="16" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Real Store Apps: iOS &amp; Android</text>
  </g>

  <!-- Card 2: Live Match Engine -->
  <g transform="translate(425, 165)">
    <rect width="345" height="205" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <rect x="16" y="16" width="4" height="22" rx="2" fill="#38bdf8" />
    <text x="28" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">Real-Time State Engine</text>
    <text x="16" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Optimistic UI updates (0ms perceived latency)</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• FIFO command queue with client_event_id</text>
    <text x="16" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Zero-CLS grid: 146 layouts → 2 per 2 ticks</text>
    <text x="16" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Transactional Undo destructive action recovery</text>
    <text x="16" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">Server-Authoritative Synchronization</text>
  </g>

  <!-- Card 3: Backend & Security -->
  <g transform="translate(805, 165)">
    <rect width="345" height="205" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="16" width="4" height="22" rx="2" fill="#34d399" />
    <text x="28" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Backend &amp; Domain Policy</text>
    <text x="16" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Node.js 22 (ESM) + TypeScript + Express</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Controller → Service → Repository pattern</text>
    <text x="16" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Account capabilities (Coach vs Athlete)</text>
    <text x="16" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Refresh token rotation with grace concurrency</text>
    <text x="16" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">23 Domain Modules &amp; Clean Boundaries</text>
  </g>

  <!-- Card 4: Relational PostgreSQL -->
  <g transform="translate(50, 395)">
    <rect width="345" height="205" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="16" width="4" height="22" rx="2" fill="#38bdf8" />
    <text x="28" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">PostgreSQL Relational Store</text>
    <text x="16" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• 37 Production SQL database migrations</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Terminal status triggers lock completed matches</text>
    <text x="16" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Partial unique indexes &amp; soft deletion</text>
    <text x="16" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• ACID transactions via dedicated PoolClients</text>
    <text x="16" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Strict Schema Safety &amp; Dry-Runs</text>
  </g>

  <!-- Card 5: Distributed Worker Engine -->
  <g transform="translate(425, 395)">
    <rect width="345" height="205" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <rect x="16" y="16" width="4" height="22" rx="2" fill="#fbbf24" />
    <text x="28" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#fbbf24">Distributed Analytics Worker</text>
    <text x="16" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Decoupled process (src/worker.ts, port 8081)</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• PostgreSQL FOR UPDATE SKIP LOCKED queue</text>
    <text x="16" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Zero horizontal worker contention</text>
    <text x="16" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Stale lease reaper &amp; bounded retry ceiling (5)</text>
    <text x="16" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">Client Exponential Polling Machine</text>
  </g>

  <!-- Card 6: Quality, Testing & CI/CD -->
  <g transform="translate(805, 395)">
    <rect width="345" height="205" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="16" width="4" height="22" rx="2" fill="#34d399" />
    <text x="28" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Testing &amp; Release Engineering</text>
    <text x="16" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• 390 Verified test files across client &amp; server</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Playwright E2E: visual, smoke, a11y, bilingual</text>
    <text x="16" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• k6 Capacity suites: smoke, load, stress, spike</text>
    <text x="16" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• GitLab CI/CD 6 stages with automated rollback</text>
    <text x="16" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">Codemagic iOS &amp; Fastlane Android</text>
  </g>
</svg>
