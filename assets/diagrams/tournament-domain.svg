<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%" role="img" aria-labelledby="dm-title dm-desc">
  <title id="dm-title">Jahiz Analytics Relational Domain Model</title>
  <desc id="dm-desc">Conceptual entity relationship diagram showing Account, Player, Team, Tournament, Encounter, Match, Events, and Analytics.</desc>
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <marker id="ar5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1100" height="640" rx="16" fill="url(#bg5)" stroke="#1e293b" stroke-width="2" />

  <g transform="translate(40, 40)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Relational Domain Entity Architecture</text>
    <text y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Conceptual schema hierarchy modeling multi-tier karate competition, roster ownership, and performance intelligence</text>
  </g>

  <!-- Entity 1: User / Account -->
  <g transform="translate(420, 90)">
    <rect width="260" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <rect x="0" y="0" width="260" height="28" rx="8" fill="#1e293b" />
    <text x="130" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">users / accounts</text>
    <text x="16" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">PK user_id (UUID)</text>
    <text x="16" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">role: 'coach' | 'athlete'</text>
    <text x="16" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">email, canonical_email_idx</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">deleted_at (soft delete support)</text>
  </g>

  <!-- Entity 2: Players / Athletes -->
  <g transform="translate(60, 240)">
    <rect width="260" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="28" rx="8" fill="#1e293b" />
    <text x="130" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">players / athlete_profiles</text>
    <text x="16" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">PK player_id</text>
    <text x="16" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">FK user_id (coach owner or self)</text>
    <text x="16" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">type: 'managed' | 'self'</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">category, weight, birth_date, country</text>
  </g>

  <!-- Entity 3: Teams -->
  <g transform="translate(420, 240)">
    <rect width="260" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="28" rx="8" fill="#1e293b" />
    <text x="130" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">teams / team_members</text>
    <text x="16" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">PK team_id</text>
    <text x="16" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">FK coach_id</text>
    <text x="16" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">gender_eligibility, name, avatar</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">N:M roster mapping via team_members</text>
  </g>

  <!-- Entity 4: Tournaments -->
  <g transform="translate(780, 240)">
    <rect width="260" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="28" rx="8" fill="#1e293b" />
    <text x="130" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">tournaments / reports</text>
    <text x="16" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">PK tournament_id</text>
    <text x="16" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">FK user_id</text>
    <text x="16" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">type: 'individual' | 'team'</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">tournament_report_snapshots</text>
  </g>

  <path d="M 460 200 L 220 240" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar5)" />
  <path d="M 550 200 L 550 240" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar5)" />
  <path d="M 640 200 L 880 240" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar5)" />

  <!-- Entity 5: Encounters (Team Bouts) -->
  <g transform="translate(600, 390)">
    <rect width="240" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="26" rx="8" fill="#1e293b" />
    <text x="120" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">encounters (Team Match Set)</text>
    <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">PK encounter_id</text>
    <text x="16" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">FK tournament_id, team_id</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Multi-bout team progression</text>
  </g>

  <!-- Entity 6: Matches -->
  <g transform="translate(240, 390)">
    <rect width="280" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <rect x="0" y="0" width="280" height="26" rx="8" fill="#1e293b" />
    <text x="140" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">matches</text>
    <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">PK match_id</text>
    <text x="16" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">FK user_id, player_id, encounter_id</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">status: 'draft'|'in_progress'|'completed'</text>
    <text x="16" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">aka_score, ao_score, senshu, winner</text>
  </g>

  <path d="M 190 360 L 290 390" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar5)" />
  <path d="M 720 360 L 720 390" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar5)" />
  <path d="M 600 435 L 520 435" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar5)" />

  <!-- Entity 7: Match Events -->
  <g transform="translate(100, 520)">
    <rect width="320" height="100" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="26" rx="8" fill="#1e293b" />
    <text x="160" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">match_events (Append-Only)</text>
    <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">PK event_id, FK match_id</text>
    <text x="16" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">client_event_id (idempotency key)</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">type: 'score'|'penalty'|'senshu'|'timer'</text>
    <text x="16" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">technique: 'tsuki'|'geri', match_time, pts</text>
  </g>

  <!-- Entity 8: Match Analytics -->
  <g transform="translate(560, 520)">
    <rect width="320" height="100" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="26" rx="8" fill="#1e293b" />
    <text x="160" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">match_analytics &amp; tasks</text>
    <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">PK task_id, FK match_id (UNIQUE)</text>
    <text x="16" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">status: 'PENDING'|'PROCESSING'|'COMPLETED'</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">efficacy_rate, score_distribution, lead_changes</text>
    <text x="16" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">technique_breakdown (JSONB), generated_at</text>
  </g>

  <path d="M 320 500 L 260 520" stroke="#34d399" stroke-width="1.5" marker-end="url(#ar5)" />
  <path d="M 440 500 L 620 520" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ar5)" />
</svg>
