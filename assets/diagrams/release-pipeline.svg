<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Jahiz release safety flow</title>
  <desc id="desc">A release progresses through validation, build, staging, verification, preflight and controlled production deployment.</desc>
  <rect width="1200" height="520" rx="24" fill="#0b1220"/>
  <text x="60" y="68" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Release Safety Flow</text>
  <text x="60" y="102" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#94a3b8">Conceptual stages; exact CI jobs can evolve</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <g font-family="system-ui,-apple-system,sans-serif">
    <g transform="translate(50 185)"><rect width="150" height="110" rx="16" fill="#111c31" stroke="#334155"/><text x="75" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Validate</text><text x="75" y="72" text-anchor="middle" font-size="12" fill="#94a3b8">types · tests</text><text x="75" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">i18n · secrets</text></g>
    <g transform="translate(240 185)"><rect width="150" height="110" rx="16" fill="#111c31" stroke="#38bdf8"/><text x="75" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Build</text><text x="75" y="72" text-anchor="middle" font-size="12" fill="#94a3b8">reviewed release</text><text x="75" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">artifact</text></g>
    <g transform="translate(430 185)"><rect width="150" height="110" rx="16" fill="#111c31" stroke="#a78bfa"/><text x="75" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Staging</text><text x="75" y="72" text-anchor="middle" font-size="12" fill="#94a3b8">candidate +</text><text x="75" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">compatible schema</text></g>
    <g transform="translate(620 185)"><rect width="150" height="110" rx="16" fill="#111c31" stroke="#34d399"/><text x="75" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Verify</text><text x="75" y="72" text-anchor="middle" font-size="12" fill="#94a3b8">health · readiness</text><text x="75" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">critical smoke</text></g>
    <g transform="translate(810 185)"><rect width="150" height="110" rx="16" fill="#111c31" stroke="#f59e0b"/><text x="75" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Preflight</text><text x="75" y="72" text-anchor="middle" font-size="12" fill="#94a3b8">schema · migration</text><text x="75" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">recovery plan</text></g>
    <g transform="translate(1000 185)"><rect width="150" height="110" rx="16" fill="#111c31" stroke="#ef4444"/><text x="75" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Production</text><text x="75" y="72" text-anchor="middle" font-size="12" fill="#94a3b8">controlled</text><text x="75" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">promotion</text></g>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M200 240 H230"/><path d="M390 240 H420"/><path d="M580 240 H610"/><path d="M770 240 H800"/><path d="M960 240 H990"/></g>
  <text x="270" y="390" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#94a3b8">Mobile releases additionally require build/version consistency, signing, store submission and client compatibility policy.</text>
</svg>
