<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Jahiz live match event flow</title>
  <desc id="desc">An operator action updates local NgRx state, enters an ordered pending queue, is validated and persisted by the server, then acknowledged or reconciled.</desc>
  <rect width="1200" height="520" rx="24" fill="#0b1220"/>
  <text x="60" y="66" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Live Match Command Flow</text>
  <text x="60" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#94a3b8">Responsive local feedback; server-authoritative persistence</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <g font-family="system-ui,-apple-system,sans-serif">
    <g transform="translate(55 180)"><rect width="185" height="120" rx="16" fill="#111c31" stroke="#334155"/><text x="92" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Operator action</text><text x="92" y="70" text-anchor="middle" font-size="13" fill="#94a3b8">score · penalty</text><text x="92" y="92" text-anchor="middle" font-size="13" fill="#94a3b8">timer · Undo</text></g>
    <g transform="translate(285 180)"><rect width="185" height="120" rx="16" fill="#111c31" stroke="#38bdf8"/><text x="92" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Optimistic state</text><text x="92" y="70" text-anchor="middle" font-size="13" fill="#94a3b8">NgRx reflects</text><text x="92" y="92" text-anchor="middle" font-size="13" fill="#94a3b8">eligible action locally</text></g>
    <g transform="translate(515 180)"><rect width="185" height="120" rx="16" fill="#111c31" stroke="#a78bfa"/><text x="92" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Pending command</text><text x="92" y="70" text-anchor="middle" font-size="13" fill="#94a3b8">ordered + identified</text><text x="92" y="92" text-anchor="middle" font-size="13" fill="#94a3b8">for safe retry</text></g>
    <g transform="translate(745 180)"><rect width="185" height="120" rx="16" fill="#111c31" stroke="#f59e0b"/><text x="92" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Backend</text><text x="92" y="70" text-anchor="middle" font-size="13" fill="#94a3b8">validate policy</text><text x="92" y="92" text-anchor="middle" font-size="13" fill="#94a3b8">persist transactionally</text></g>
    <g transform="translate(975 180)"><rect width="170" height="120" rx="16" fill="#111c31" stroke="#34d399"/><text x="85" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Canonical state</text><text x="85" y="70" text-anchor="middle" font-size="13" fill="#94a3b8">acknowledge or</text><text x="85" y="92" text-anchor="middle" font-size="13" fill="#94a3b8">reconcile client</text></g>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M240 240 H275"/><path d="M470 240 H505"/><path d="M700 240 H735"/><path d="M930 240 H965"/><path d="M1060 310 C1060 405 380 405 380 310"/></g>
  <text x="706" y="426" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#94a3b8">rejection / revalidation returns authoritative state to the client</text>
</svg>
