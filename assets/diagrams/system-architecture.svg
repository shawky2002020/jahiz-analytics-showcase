<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Jahiz Analytics system architecture</title>
  <desc id="desc">Mobile client communicates with a Node.js API backed by PostgreSQL, with a separate analytics worker claiming background tasks.</desc>
  <rect width="1200" height="620" rx="24" fill="#0b1220"/>
  <text x="60" y="72" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Jahiz Analytics — System Architecture</text>
  <text x="60" y="108" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#94a3b8">Public-safe runtime boundaries and data flow</text>

  <g font-family="system-ui,-apple-system,sans-serif">
    <rect x="70" y="180" width="250" height="170" rx="18" fill="#111c31" stroke="#334155" stroke-width="2"/>
    <text x="95" y="220" font-size="19" font-weight="700" fill="#f8fafc">Mobile client</text>
    <text x="95" y="254" font-size="14" fill="#cbd5e1">Angular · Ionic · Capacitor</text>
    <text x="95" y="282" font-size="14" fill="#cbd5e1">NgRx · RxJS</text>
    <text x="95" y="318" font-size="13" fill="#94a3b8">Optimistic UI + reconciliation</text>

    <rect x="475" y="150" width="250" height="200" rx="18" fill="#111c31" stroke="#38bdf8" stroke-width="2"/>
    <text x="500" y="195" font-size="19" font-weight="700" fill="#f8fafc">HTTP API</text>
    <text x="500" y="229" font-size="14" fill="#cbd5e1">Node.js · TypeScript · Express</text>
    <text x="500" y="265" font-size="13" fill="#94a3b8">Authentication &amp; ownership</text>
    <text x="500" y="289" font-size="13" fill="#94a3b8">Domain policy &amp; transactions</text>
    <text x="500" y="313" font-size="13" fill="#94a3b8">Canonical match state</text>

    <rect x="870" y="180" width="250" height="170" rx="18" fill="#111c31" stroke="#34d399" stroke-width="2"/>
    <text x="895" y="220" font-size="19" font-weight="700" fill="#f8fafc">PostgreSQL</text>
    <text x="895" y="254" font-size="14" fill="#cbd5e1">Transactional system of record</text>
    <text x="895" y="286" font-size="13" fill="#94a3b8">Matches · players · teams</text>
    <text x="895" y="310" font-size="13" fill="#94a3b8">tournaments · analytics tasks</text>

    <rect x="475" y="430" width="250" height="120" rx="18" fill="#111c31" stroke="#f59e0b" stroke-width="2"/>
    <text x="500" y="472" font-size="19" font-weight="700" fill="#f8fafc">Analytics worker</text>
    <text x="500" y="504" font-size="14" fill="#cbd5e1">Background aggregation</text>
    <text x="500" y="530" font-size="13" fill="#94a3b8">Task claim via SKIP LOCKED</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M320 260 H465"/>
    <path d="M725 260 H860"/>
    <path d="M995 350 C995 430 790 490 735 490"/>
    <path d="M475 490 C400 490 360 360 500 350"/>
  </g>
  <g font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#94a3b8">
    <text x="355" y="246">HTTPS commands / reads</text>
    <text x="760" y="246">SQL transactions</text>
    <text x="770" y="444">available tasks</text>
    <text x="353" y="450">derived state</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
